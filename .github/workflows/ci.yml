name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GCP deploy target (identifiers, not secrets). Created by infra/bootstrap.sh.
env:
  GCP_PROJECT_ID: pocketshark
  GCP_REGION: us-central1
  GCP_WIF_PROVIDER: projects/166341647898/locations/global/workloadIdentityPools/github/providers/pocketshark-repo
  GCP_DEPLOYER_SA: pocketshark-deployer@pocketshark.iam.gserviceaccount.com
  GCP_RUNTIME_SA: pocketshark-run@pocketshark.iam.gserviceaccount.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - run: npm run install:all
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_DISABLED != 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: pocketshark-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push API image
        run: |
          PROJECT="$GCP_PROJECT_ID"; REGION="$GCP_REGION"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/pocketshark/api:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" server
          docker push "$IMAGE"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" \
            --service-account "$GCP_RUNTIME_SA" \
            --allow-unauthenticated --port 8080 --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 3 --concurrency 80 \
            --set-env-vars "SITE_URL=https://mypocketshark.com" \
            --set-secrets "STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest"

      - name: Deploy storefront to Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive

      - name: Smoke test
        run: |
          URL="https://$GCP_PROJECT_ID.web.app"
          curl -fsS "$URL/api/health"
          curl -fsS -o /dev/null "$URL/"
